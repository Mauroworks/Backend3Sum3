spring.application.name=procesadorf1

# ===== Base de datos en memoria (H2) =====
spring.datasource.url=jdbc:h2:mem:procesadorf1;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Spring Batch =====
# Desactivamos la ejecucion automatica de Jobs al arrancar;
# los Jobs se ejecutan de forma controlada desde BatchRunner.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ===== Console H2 (opcional, para inspeccionar datos) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Parametros del proceso =====
batch.chunk.size=50
batch.threads.core=4
batch.threads.max=8
batch.threads.queue=100
batch.skip.max=100000

# ===== Logging =====
logging.level.org.springframework.batch=INFO
logging.level.com.duoc.batch.procesadorf1=INFO
