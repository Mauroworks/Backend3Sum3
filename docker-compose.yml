version: '3.8'

services:
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - f1-network

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - f1-network

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - eureka-server
    networks:
      - f1-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - f1-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - f1-network

  csv-result-api:
    build:
      context: ./csv-result-api
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - config-server
      - auth-server
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - f1-network

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    depends_on:
      - eureka-server
      - config-server
      - auth-server
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - f1-network

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    depends_on:
      - eureka-server
      - config-server
      - auth-server
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - f1-network

networks:
  f1-network:
    driver: bridge
