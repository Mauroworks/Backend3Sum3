spring.application.name=bff-atm

# ===== HTTPS =====
server.port=8083
server.ssl.enabled=true
server.ssl.key-store=classpath:bff-atm.p12
server.ssl.key-store-password=banco123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bffatm

# ===== Base de datos en memoria (H2) =====
spring.datasource.url=jdbc:h2:mem:bffatm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Spring Batch: la carga la controla BatchDataInitializer =====
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ===== Console H2 (opcional) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Parametros del batch =====
batch.chunk.size=50
batch.threads.core=4
batch.threads.max=8
batch.threads.queue=100
batch.skip.max=100000
batch.csv.path=csvsemana3

# ===== Autenticacion / autorizacion del canal Cajero =====
bff.security.user=atm
bff.security.password=atm123
bff.security.role=ATM_USER

# ===== Parametros del cajero =====
atm.pin.default=1234
atm.cajero.id=ATM-001
atm.cajero.version=1.0.0

# ===== Logging =====
logging.level.org.springframework.batch=INFO
logging.level.com.duoc=INFO